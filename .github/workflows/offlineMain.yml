name: Build Offline Binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.15.7-offline)'
        required: true
        default: 'v1.15.7-offline'
  push:
    tags:
      - 'v*-offline*'

env:
  OFFLINE_VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  build-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
            target: linux-x64
            jarvis_target: jarvis-linux-x64
            binary_name: jarvis-offline-linux-x64
          - os: ubuntu-latest
            platform: linux
            arch: arm64
            target: linux-arm64
            jarvis_target: jarvis-linux-arm64
            binary_name: jarvis-offline-linux-arm64
          - os: ubuntu-latest
            platform: linux
            arch: arm64
            target: linux-arm64-musl
            jarvis_target: jarvis-linux-arm64-musl
            binary_name: jarvis-offline-linux-arm64-musl
          - os: macos-latest
            platform: darwin
            arch: x64
            target: darwin-x64
            jarvis_target: jarvis-darwin-x64
            binary_name: jarvis-offline-macos-x64
          - os: macos-latest
            platform: darwin
            arch: arm64
            target: darwin-arm64
            jarvis_target: jarvis-darwin-arm64
            binary_name: jarvis-offline-macos-arm64
          - os: windows-latest
            platform: win32
            arch: x64
            target: win32-x64
            jarvis_target: jarvis-windows-x64
            binary_name: jarvis-offline-windows-x64
          - os: windows-latest
            platform: win32
            arch: arm64
            target: win32-arm64
            jarvis_target: jarvis-windows-arm64
            binary_name: jarvis-offline-windows-arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install

      - name: Build Jarvis
        env:
          OPENCODE_OFFLINE_MODE: true
        run: |
          echo "Building for ${{ matrix.jarvis_target }}"
          cd packages/opencode
          bun run build --target=${{ matrix.jarvis_target }}

      - name: Package CLI binary
        shell: bash
        run: |
          mkdir -p dist-offline
          cp -r packages/opencode/dist/${{ matrix.jarvis_target }}/* ./dist-offline/
          
          if [ "${{ matrix.platform }}" = "win32" ]; then
            7z a ${{ matrix.binary_name }}.zip ./dist-offline/*
          else
            tar -czf ${{ matrix.binary_name }}.tar.gz -C ./dist-offline .
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_name }}
          path: ${{ matrix.binary_name }}.*
          retention-days: 7

  create-release:
    needs: build-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.OFFLINE_VERSION }}
          name: Jarvis Offline ${{ env.OFFLINE_VERSION }}
          files: artifacts/*
          body: |
            # Jarvis Offline Binaries
            
            ## Version: ${{ env.OFFLINE_VERSION }}
            
            ### Features:
            - 🔒 Fully offline operation
            - 🚫 No external connections except configured API endpoints
            - ⚡ CLI binaries for all platforms
            - 🛡️ Privacy-focused
            
            ### Included Platforms:
            - Linux x64
            - Linux ARM64
            - Linux ARM64 Musl
            - macOS x64
            - macOS ARM64
            - Windows x64
            - Windows ARM64
